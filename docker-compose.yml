services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mlp-backend
    ports:
      - "5134:5134"
    environment:
      - ASPNETCORE_URLS=http://+:5134
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
